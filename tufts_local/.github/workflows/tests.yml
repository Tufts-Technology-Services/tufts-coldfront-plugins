name: Tests

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"

      - name: Install dependencies (including dev)
        run: uv sync

      - name: Run tests
        run: uv run pytest --cov=tufts_local --cov-report=term tufts_local/tests
