[project]
name = "tufts-coldfront-plugins"
version = "0.2.0"
description = "Plugins for Tufts ColdFront system."
authors = [
	{ name = "Chris Barnett", email = "christopher.barnett@tufts.edu" }
]
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
keywords = ["high-performance-computing", "resource-allocation"]
classifiers = [
    'Programming Language :: Python :: 3',
    'Framework :: Django :: 4.2',
    'Framework :: Django :: 5.2',
    'Topic :: Scientific/Engineering',
    'Topic :: System :: Systems Administration',
    'Topic :: Internet :: WWW/HTTP :: WSGI :: Application',
]
dependencies = [
    "coldfront>=1.1.7,<2",
    "pyinfra>=3.10.0,<=3.11.0",
    "djangosaml2",
    "coldfront-utils @ git+https://github.com/Tufts-Technology-Services/coldfront-utils",
    "coldfront-storage-plugin @ git+https://github.com/Tufts-Technology-Services/coldfront-storage-plugin",
    # app: coldfront_billing. Private repo under the TuftsRT org: ssh remote.
    "coldfront-billing@git+ssh://git@github.com/TuftsRT/coldfront-billing-plugin.git",
    "starfish-api-client @ git+https://github.com/Tufts-Technology-Services/starfish-api-client",
]

[dependency-groups]
dev = [
    "pre-commit",
    "ruff",
    "pytest",
    "pytest-django",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tufts_local"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv]
# coldfront/core/publication/views.py imports bibtexparser.bibdatabase, which 2.x removed.
# coldfront depends on bibtexparser only through doi2bib, which declares no upper bound, so
# a plain resolve picks 2.x and every page 500s on the root URLconf. A constraint rather
# than a dependency: it steers this project's lock without going into published metadata,
# where it could collide with the other plugins installed beside this one.
constraint-dependencies = ["bibtexparser<2"]

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true

[tool.ruff]
line-length = 120
indent-width = 4
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "Q", "S308"]

[tool.ruff.lint.flake8-quotes]
inline-quotes = "single"

[tool.ruff.format]
indent-style = "space"
docstring-code-format = true
quote-style = "single"

[tool.ruff.lint.isort]
sections = { "coldfront-main" = ["coldfront"] }
section-order = [
    "future",
    "standard-library",
    "third-party",
    "coldfront-main",
    "first-party",
    "local-folder",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tufts_local.tests.settings"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--tb=short"
]
markers = [
    "django_db: marks tests as requiring database access",
]
testpaths = ["tufts_local/tests"]
